name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails the deploy on a type error. Vite transpiles without checking
      # types, so without this step a type regression would ship silently.
      - name: Type check
        run: npm run typecheck

      # The anon key is public on a static host, so the RLS policies are the
      # whole security model. These run against real Postgres (PGlite) in a few
      # seconds and take no external service, so a policy regression fails the
      # build rather than shipping.
      - name: Database policy tests
        run: npm run db:test

      - name: Build
        run: npm run build
        env:
          # Repository *variables*, not secrets: Vite inlines every VITE_ value
          # into the bundle, so these are public the moment the site ships. The
          # anon key grants nothing on its own - Row Level Security is what
          # protects the data. The service_role key must never appear here.
          #
          # If these are unset the build still succeeds and the app runs in
          # demo mode (see src/lib/supabase.ts), so nothing breaks before they
          # are configured.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
