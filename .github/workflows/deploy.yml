name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails the deploy on a type error. Vite transpiles without checking
      # types, so without this step a type regression would ship silently.
      - name: Type check
        run: npm run typecheck

      # The anon key is public on a static host, so the RLS policies are the
      # whole security model. These run against real Postgres (PGlite) in a few
      # seconds and take no external service, so a policy regression fails the
      # build rather than shipping.
      - name: Database policy tests
        run: npm run db:test

      # Which month's rent is settled is date arithmetic, and driving the app
      # only ever tests today. These pin the year boundary and the grace period.
      - name: Rent period tests
        run: npm run test:rent

      # What "complete" means branches by role, and a browser only ever tests
      # the account it happens to be signed in as.
      - name: Account completion tests
        run: npm run test:completion

      # What reaches the landlord's attention strip is judgement, not
      # arithmetic, and a browser run only ever sees one portfolio.
      - name: Attention tests
        run: npm run test:attention

      # A receipt is a document someone may file with a tax claim. Which
      # payments may produce one, and the amount written out in lakh and
      # crore, are both worth pinning where a browser cannot reach them.
      - name: Rent receipt tests
        run: npm run test:receipt

      # A tel: or mailto: built wrong looks identical on screen - the button
      # is enabled, the number is shown, and pressing it does nothing. Only
      # asserting on the built string catches that.
      - name: Contact link tests
        run: npm run test:contact

      # Which store the session and the PKCE verifier land in. Getting the
      # verifier wrong breaks password recovery for a whole class of users
      # and cannot be seen anywhere in the UI.
      - name: Auth storage tests
        run: npm run test:auth-storage

      # Whether this build will show a captcha, said out loud.
      #
      # A key that never arrived produces a build that looks completely normal
      # and silently has no captcha; if the Supabase project has captcha
      # protection on, that build locks everyone out with an error about
      # credentials. The one place that can answer "did my key take effect" is
      # here, so it should not require reading the bundle to find out.
      - name: Report captcha configuration
        env:
          SITE_KEY: ${{ vars.VITE_HCAPTCHA_SITE_KEY || secrets.VITE_HCAPTCHA_SITE_KEY }}
        run: |
          if [ -n "$SITE_KEY" ]; then
            echo "hCaptcha site key found (${#SITE_KEY} chars) - the auth forms will show a captcha."
            echo "Supabase must have captcha protection ON, with the matching secret."
          else
            echo "No hCaptcha site key - the auth forms will show no captcha and send no token."
            echo "Supabase must have captcha protection OFF, or nobody will be able to sign in."
          fi

      - name: Build
        run: npm run build
        env:
          # Repository *variables*, not secrets: Vite inlines every VITE_ value
          # into the bundle, so these are public the moment the site ships. The
          # anon key grants nothing on its own - Row Level Security is what
          # protects the data. The service_role key must never appear here.
          #
          # If these are unset the build still succeeds and the app runs in
          # demo mode (see src/lib/supabase.ts), so nothing breaks before they
          # are configured.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Public like the others: it is handed to the browser to render the
          # widget. The hCaptcha *secret* lives in the Supabase dashboard and
          # belongs nowhere near this file. Unset, the forms show no captcha -
          # which must match the dashboard, or nobody can sign in.
          #
          # Read from either place. A variable is the right home for a public
          # value, but "Secrets and variables" puts the two behind one menu and
          # a site key filed as a secret is an easy mistake that ends with a
          # build that silently has no captcha - and no way to tell from the
          # outside which of the two was meant.
          VITE_HCAPTCHA_SITE_KEY: ${{ vars.VITE_HCAPTCHA_SITE_KEY || secrets.VITE_HCAPTCHA_SITE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
